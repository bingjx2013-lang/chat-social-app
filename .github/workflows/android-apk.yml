name: Android APK build

on:
  push:
    branches: [mobile-app-stage1, call-permissions-stage1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install app dependencies
        run: npm install
      - name: Run security regression tests
        run: npm test
      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
      - name: Configure Android wrapper
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.weiliao.chat",
            "appName": "微聊",
            "webDir": "public",
            "server": {
              "url": "https://chat-social-app-mobile-test.onrender.com",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Add Android camera and microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          for permission in ('android.permission.CAMERA', 'android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS'):
              if f'name="{permission}"' not in text:
                  text = text.replace('<manifest ', f'<manifest ', 1)
                  text = re.sub(r'(<manifest[^>]*>)', r'\\1\\n    <uses-permission android:name="' + permission + '" />', text, count=1)
          manifest.write_text(text)
          java = Path('android/app/src/main/java/com/weiliao/chat/MainActivity.java')
          java.write_text('''package com.weiliao.chat;

import android.Manifest;
import android.content.pm.PackageManager;
import android.webkit.PermissionRequest;
import android.webkit.WebChromeClient;
import androidx.core.content.ContextCompat;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    private PermissionRequest pendingWebPermissionRequest;
    private static final int MEDIA_PERMISSION_REQUEST = 7301;

    @Override
    public void onPermissionRequest(PermissionRequest request) {
        runOnUiThread(() -> {
            boolean needsCamera = false;
            boolean needsMic = false;
            for (String resource : request.getResources()) {
                if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) needsCamera = true;
                if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) needsMic = true;
            }
            boolean cameraGranted = !needsCamera || ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED;
            boolean micGranted = !needsMic || ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED;
            if (cameraGranted && micGranted) {
                request.grant(request.getResources());
                return;
            }
            if (pendingWebPermissionRequest != null) pendingWebPermissionRequest.deny();
            pendingWebPermissionRequest = request;
            java.util.ArrayList<String> permissions = new java.util.ArrayList<>();
            if (needsCamera && !cameraGranted) permissions.add(Manifest.permission.CAMERA);
            if (needsMic && !micGranted) permissions.add(Manifest.permission.RECORD_AUDIO);
            requestPermissions(permissions.toArray(new String[0]), MEDIA_PERMISSION_REQUEST);
        });
    }

    @Override
    public void onPermissionRequestCanceled(PermissionRequest request) {
        if (pendingWebPermissionRequest == request) pendingWebPermissionRequest = null;
    }

    @Override
    public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults);
        if (requestCode != MEDIA_PERMISSION_REQUEST || pendingWebPermissionRequest == null) return;
        PermissionRequest request = pendingWebPermissionRequest;
        pendingWebPermissionRequest = null;
        boolean allGranted = true;
        for (String permission : request.getResources()) {
            if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(permission) && ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) allGranted = false;
            if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(permission) && ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) allGranted = false;
        }
        if (allGranted) request.grant(request.getResources()); else request.deny();
    }
}
''')
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/mobile-app-stage1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk weiliao.apk
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 \
            --title "微聊 Android 测试版 v1.0.0" \
            --notes "微聊 Android 测试安装包。此 APK 为连接微聊移动测试站点的安装包；安装后需联网使用。"
          gh release upload v1.0.0 weiliao.apk --clobber
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weiliao-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
