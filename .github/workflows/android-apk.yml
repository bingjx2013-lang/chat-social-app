name: Android APK build

on:
  push:
    branches: [mobile-app-stage1, call-permissions-stage1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install app dependencies
        run: npm install
      - name: Run security regression tests
        run: npm test
      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
      - name: Configure Android wrapper
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.weiliao.chat",
            "appName": "微聊",
            "webDir": "public",
            "server": {
              "url": "https://chat-social-app-call-test.onrender.com",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Add Android camera and microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          marker = '<manifest'
          close = text.find('>', text.find(marker)) + 1
          if close < 1:
              raise SystemExit('Could not find Android manifest root element')
          permissions = ('android.permission.CAMERA', 'android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS')
          additions = ''.join(f'\n    <uses-permission android:name="{p}" />' for p in permissions if f'name="{p}"' not in text)
          text = text[:close] + additions + text[close:]
          manifest.write_text(text)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/mobile-app-stage1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk weiliao.apk
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 \
            --title "微聊 Android 测试版 v1.0.0" \
            --notes "微聊 Android 测试安装包。此 APK 为连接微聊移动测试站点的安装包；安装后需联网使用。"
          gh release upload v1.0.0 weiliao.apk --clobber
      - name: Publish call-permissions test APK as a separate prerelease
        if: github.ref == 'refs/heads/call-permissions-stage1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk weiliao-call-permissions-test.apk
          gh release view v1.0.0-call-permissions-test >/dev/null 2>&1 || gh release create v1.0.0-call-permissions-test \
            --title "微聊通话权限修复测试版" \
            --prerelease \
            --notes "独立通话权限修复测试包。使用独立测试站点 chat-social-app-call-test.onrender.com；未修改正式版 main，也不会覆盖稳定版 APK。"
          gh release upload v1.0.0-call-permissions-test weiliao-call-permissions-test.apk --clobber
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weiliao-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
